<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ห้องวาดรูปแสนสนุก 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;padding:12px;font-family:"Prompt",-apple-system,sans-serif;background:#fef6e4;color:#172c66;display:flex;flex-direction:column;align-items:center}
h1{margin:4px 0 10px;font-size:24px;color:#ff5470;text-shadow:1px 1px 0 #ffe699;text-align:center}
.main-layout{display:flex;flex-direction:column;gap:12px;width:100%;max-width:900px;align-items:center}
.toolbar-card{background:#fff;border:3px solid #001858;border-radius:20px;padding:12px;width:100%;box-shadow:0 6px 0 #001858;display:flex;flex-direction:column;gap:12px}
.tool-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;font:600 15px "Prompt",sans-serif;border:2px solid #001858;border-radius:14px;background:#fffffe;color:#001858;cursor:pointer;box-shadow:0 4px 0 #001858;transition:transform .08s,box-shadow .08s}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #001858}
.big-btn.active{background:#f582ae;color:#fff}
.big-btn:disabled{opacity:.6}
.brush-sizes{display:flex;gap:8px;background:#f3f4f6;padding:4px 8px;border-radius:14px;border:2px solid #001858}
.size-btn{width:42px;height:42px;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.size-btn.active{background:#ffde59;border-color:#001858}
.dot{background:#001858;border-radius:50%}
.palette-box{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.color-swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #001858;cursor:pointer;transition:transform .1s}
.color-swatch:active,.color-swatch.active{transform:scale(1.2);box-shadow:0 0 0 3px #ff5470}
.custom-color-label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;background:#e3f2fd;padding:6px 10px;border-radius:12px;border:2px solid #001858;cursor:pointer}
#customColor{width:28px;height:28px;border:none;background:transparent;cursor:pointer}
.mixer-zone{background:#fdf0ed;border:2px dashed #f582ae;border-radius:16px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;width:100%}
.mixer-drops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.drop-btn{padding:6px 10px;border-radius:14px;border:2px solid #001858;font:600 13px "Prompt",sans-serif;cursor:pointer;box-shadow:0 2px 0 #001858;background:#fff}
.drop-btn:active{transform:translateY(2px);box-shadow:none}
#mixColorDisplay{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #001858;background:#fff}
.paper-swatch{width:38px;height:38px;border-radius:8px;border:3px solid #001858;cursor:pointer;box-shadow:0 3px 0 #001858}
.paper-swatch.active{outline:3px solid #ff5470;outline-offset:2px}
#canvas-card{position:relative;background:#fff;border:4px solid #001858;border-radius:20px;box-shadow:0 8px 0 #001858;touch-action:none;overflow:hidden;width:100%;display:flex;justify-content:center}
canvas#paintCanvas{display:block;background:#fff;cursor:crosshair;width:100%;max-width:860px;height:auto;aspect-ratio:860/460;touch-action:none}
#statusText{font-size:15px;font-weight:600;min-height:24px;text-align:center}
#modal3D{display:none;position:fixed;inset:0;background:rgba(0,24,88,.85);backdrop-filter:blur(4px);z-index:999;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.modal-content{background:#fff;border:4px solid #001858;border-radius:24px;box-shadow:0 10px 0 #001858;width:100%;max-width:860px;display:flex;flex-direction:column;overflow:hidden}
.modal-header{background:#ffde59;border-bottom:3px solid #001858;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-header h2{margin:0;font-size:16px;color:#001858}
#threeContainer{width:100%;height:55vh;min-height:260px;background:radial-gradient(circle,#f8fafc 0%,#cbd5e1 100%);cursor:grab;touch-action:none}
#threeContainer:active{cursor:grabbing}
#threeContainer canvas{display:block}
.modal-controls{border-top:3px solid #001858;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<h1>🎨 สมุดวาดรูปแสนสนุก 3D ✏️</h1>

<div class="main-layout">
  <div class="toolbar-card">
    <div class="tool-row">
      <button id="pencilBtn" class="big-btn active" type="button">✏️ ดินสอ</button>
      <button id="eraserBtn" class="big-btn" type="button">🧼 ยางลบ</button>
      <div class="brush-sizes">
        <button class="size-btn" data-size="6" type="button"><div class="dot" style="width:6px;height:6px"></div></button>
        <button class="size-btn active" data-size="16" type="button"><div class="dot" style="width:14px;height:14px"></div></button>
        <button class="size-btn" data-size="30" type="button"><div class="dot" style="width:22px;height:22px"></div></button>
      </div>
      <button id="undoBtn" class="big-btn" type="button">↩️ ถอยหลัง</button>
      <button id="clearBtn" class="big-btn" type="button">🗑️ ล้างกระดาน</button>
      <button id="open3dBtn" class="big-btn" type="button" style="background:#e0aaff;border-color:#5a189a;color:#5a189a">✨ แปลงเป็น 3 มิติ!</button>
    </div>

    <div class="palette-box">
      <div class="color-swatch active" style="background:#000" data-color="#000000"></div>
      <div class="color-swatch" style="background:#e63946" data-color="#e63946"></div>
      <div class="color-swatch" style="background:#ff7b00" data-color="#ff7b00"></div>
      <div class="color-swatch" style="background:#ffdd00" data-color="#ffdd00"></div>
      <div class="color-swatch" style="background:#70e000" data-color="#70e000"></div>
      <div class="color-swatch" style="background:#007200" data-color="#007200"></div>
      <div class="color-swatch" style="background:#4cc9f0" data-color="#4cc9f0"></div>
      <div class="color-swatch" style="background:#4361ee" data-color="#4361ee"></div>
      <div class="color-swatch" style="background:#7209b7" data-color="#7209b7"></div>
      <div class="color-swatch" style="background:#f72585" data-color="#f72585"></div>
      <div class="color-swatch" style="background:#8b5a2b" data-color="#8b5a2b"></div>
      <label class="custom-color-label"><span>🌈 เลือกสีเอง:</span><input type="color" id="customColor" value="#000000"></label>
    </div>

    <div class="palette-box">
      <span style="font-weight:600;font-size:13px">🗒️ เลือกกระดาษใหม่:</span>
      <div class="paper-swatch active" style="background:#ffffff" data-paper="#ffffff"></div>
      <div class="paper-swatch" style="background:#fff3d6" data-paper="#fff3d6"></div>
      <div class="paper-swatch" style="background:#dff1ff" data-paper="#dff1ff"></div>
      <div class="paper-swatch" style="background:#ffe3ec" data-paper="#ffe3ec"></div>
      <div class="paper-swatch" style="background:#e3f8e0" data-paper="#e3f8e0"></div>
      <div class="paper-swatch" style="background:#fff7a8" data-paper="#fff7a8"></div>
    </div>

    <div class="mixer-zone">
      <div class="mixer-drops">
        <span style="font-weight:600;font-size:13px">🧪 จานผสมสี:</span>
        <button class="drop-btn" type="button" data-drop="red">🔴 แดง</button>
        <button class="drop-btn" type="button" data-drop="yellow">🟡 เหลือง</button>
        <button class="drop-btn" type="button" data-drop="blue">🔵 น้ำเงิน</button>
        <button class="drop-btn" type="button" data-drop="white">⚪ ขาว</button>
        <button class="drop-btn" type="button" data-drop="black">⚫ ดำ</button>
        <button class="drop-btn" type="button" id="resetMixBtn" style="background:#ffe3e3">🔄 ล้างจานสี</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="mixerRecipe" style="font-size:13px;color:#555">หยดสีเพื่อผสม</span>
        <div id="mixColorDisplay"></div>
      </div>
    </div>

    <div class="tool-row" style="justify-content:flex-end">
      <button id="downloadBtn" class="big-btn" type="button" style="background:#d8f3dc">📥 ดาวน์โหลดรูป</button>
    </div>
  </div>

  <div id="canvas-card"><canvas id="paintCanvas" width="860" height="460"></canvas></div>
  <div id="statusText"></div>
</div>

<div id="modal3D">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🌟 สตูดิโอ 3 มิติ (ใช้นิ้วหรือเมาส์หมุนดูได้เลย!)</h2>
      <button id="close3dBtn" class="big-btn" type="button" style="padding:4px 10px;font-size:14px">✖️ ปิด</button>
    </div>
    <div id="threeContainer"></div>
    <div class="modal-controls">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="autoRotateBtn" class="big-btn" type="button">🔄 หมุนอัตโนมัติ: เปิด</button>
        <button id="toggleDepthBtn" class="big-btn" type="button">🏔️ ความนูน: ปกติ</button>
      </div>
      <button id="backToDrawBtn" class="big-btn" type="button" style="background:#ffde59">✏️ กลับไปวาดต่อ</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('paintCanvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
const pencilBtn = $('pencilBtn'), eraserBtn = $('eraserBtn'), clearBtn = $('clearBtn'), undoBtn = $('undoBtn');
const downloadBtn = $('downloadBtn'), customColor = $('customColor');
const statusText = $('statusText'), mixColorDisplay = $('mixColorDisplay'), mixerRecipe = $('mixerRecipe');

let paperColor = '#ffffff';
let isDrawing = false, mode = 'pencil', currentColor = '#000000', currentLineWidth = 16, historyStack = [];

// เสียง: สร้างตอนกดครั้งแรก (เบราว์เซอร์ไม่เตือน)
let audioCtx = null;
function playPop(freq = 480) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(t + 0.1);
  } catch (e) {}
}

function saveState() {
  if (historyStack.length >= 15) historyStack.shift();
  historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}
function initCanvas() {
  ctx.fillStyle = paperColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  historyStack = [];
  saveState();
}
initCanvas();

function setMode(m) {
  mode = m;
  pencilBtn.classList.toggle('active', m === 'pencil');
  eraserBtn.classList.toggle('active', m === 'eraser');
}
pencilBtn.onclick = () => { playPop(520); setMode('pencil'); };
eraserBtn.onclick = () => { playPop(380); setMode('eraser'); };

document.querySelectorAll('.size-btn').forEach(btn => btn.onclick = () => {
  playPop(440);
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLineWidth = parseInt(btn.dataset.size, 10);
});
document.querySelectorAll('.color-swatch').forEach(sw => sw.onclick = () => {
  playPop(600);
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active');
  currentColor = sw.dataset.color;
  setMode('pencil');
});
customColor.addEventListener('input', e => {
  currentColor = e.target.value;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  setMode('pencil');
});

// ---------- ผสมสี ----------
let drops = { red: 0, yellow: 0, blue: 0, white: 0, black: 0 };
const PIGMENTS = { red: {c:0, m:.9, y:.85}, yellow: {c:0, m:0, y:1}, blue: {c:.95, m:.35, y:0} };
document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { playPop(700); drops[b.dataset.drop]++; calcMix(); });
$('resetMixBtn').onclick = () => {
  playPop(300);
  drops = { red: 0, yellow: 0, blue: 0, white: 0, black: 0 };
  mixColorDisplay.style.background = '#ffffff';
  mixerRecipe.textContent = 'หยดสีเพื่อผสม';
};
function calcMix() {
  const cd = drops.red + drops.yellow + drops.blue, total = cd + drops.white + drops.black;
  if (!total) return;
  let c = 0, m = 0, y = 0;
  if (cd) for (const k of ['red', 'yellow', 'blue']) {
    c += drops[k] * PIGMENTS[k].c / cd; m += drops[k] * PIGMENTS[k].m / cd; y += drops[k] * PIGMENTS[k].y / cd;
  }
  let r = 255 * (1 - c), g = 255 * (1 - m), b = 255 * (1 - y);
  if (drops.white) { const w = drops.white / total; r = r*(1-w)+255*w; g = g*(1-w)+255*w; b = b*(1-w)+255*w; }
  if (drops.black) { const k = drops.black / total; r = r*(1-k)+25*k; g = g*(1-k)+25*k; b = b*(1-k)+25*k; }
  const hex = '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
  currentColor = hex;
  mixColorDisplay.style.background = hex;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  setMode('pencil');
  const names = { red: 'แดง', yellow: 'เหลือง', blue: 'น้ำเงิน', white: 'ขาว', black: 'ดำ' };
  mixerRecipe.textContent = Object.keys(names).filter(k => drops[k]).map(k => names[k] + ' x' + drops[k]).join(' + ');
}

// ---------- วาด ----------
function getCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const p = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: (p.clientX - rect.left) * canvas.width / rect.width, y: (p.clientY - rect.top) * canvas.height / rect.height };
}
function applyBrush() {
  ctx.lineWidth = currentLineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = mode === 'eraser' ? paperColor : currentColor;
}
function startDraw(e) {
  isDrawing = true;
  const pos = getCoords(e);
  applyBrush();
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  ctx.lineTo(pos.x + 0.01, pos.y); // จิ้มครั้งเดียวก็เกิดจุด
  ctx.stroke();
  e.preventDefault();
}
function drawing(e) {
  if (!isDrawing) return;
  const pos = getCoords(e);
  applyBrush();
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  e.preventDefault();
}
function stopDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  ctx.closePath();
  saveState();
}
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', drawing);
window.addEventListener('mouseup', stopDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', drawing, { passive: false });
canvas.addEventListener('touchend', stopDraw);
canvas.addEventListener('touchcancel', stopDraw);

// เลือกกระดาษใหม่: ถ้ามีรูปวาดอยู่ ต้องกดซ้ำเพื่อยืนยัน
let paperTimer = null, paperPending = null;
document.querySelectorAll('.paper-swatch').forEach(sw => sw.onclick = () => {
  playPop(450);
  if (historyStack.length > 1 && paperPending !== sw) {
    paperPending = sw;
    statusText.style.color = '#001858';
    statusText.textContent = '📄 มีรูปวาดอยู่นะ! กดกระดาษสีเดิมอีกครั้งเพื่อเริ่มแผ่นใหม่ (รูปเก่าจะหาย)';
    clearTimeout(paperTimer);
    paperTimer = setTimeout(() => { paperPending = null; statusText.textContent = ''; }, 3000);
    return;
  }
  paperPending = null; clearTimeout(paperTimer); statusText.textContent = '';
  paperColor = sw.dataset.paper;
  document.querySelectorAll('.paper-swatch').forEach(s => s.classList.toggle('active', s === sw));
  initCanvas();
});

undoBtn.onclick = () => {
  playPop(350);
  if (historyStack.length > 1) { historyStack.pop(); ctx.putImageData(historyStack[historyStack.length - 1], 0, 0); }
};

// ล้างกระดาน: กดสองครั้ง (ไม่ใช้ confirm() เพราะใน iframe อาจถูกบล็อก)
let clearTimer = null;
clearBtn.onclick = () => {
  playPop(250);
  if (clearTimer) {
    clearTimeout(clearTimer); clearTimer = null;
    clearBtn.textContent = '🗑️ ล้างกระดาน';
    initCanvas();
  } else {
    clearBtn.textContent = '❓ แน่ใจไหม? กดอีกครั้ง';
    clearTimer = setTimeout(() => { clearTimer = null; clearBtn.textContent = '🗑️ ล้างกระดาน'; }, 2500);
  }
};

downloadBtn.onclick = () => {
  playPop(600);
  const a = document.createElement('a');
  a.download = 'ภาพวาดฝีมือฉัน.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};

// =========================================================
// ระบบแสดงผล 3D (Three.js 3D Relief Engine)
// ภาพวาดกลายเป็นพื้นผิวนูน: เส้น/สีที่วาดจะนูนขึ้น พื้นขาวเรียบ
// =========================================================
const modal = $('modal3D'), container = $('threeContainer');
const autoRotateBtn = $('autoRotateBtn'), toggleDepthBtn = $('toggleDepthBtn');
let renderer, scene, camera, controls, mesh, heights, rafId = null, depthIdx = 0;
const DEPTHS = [{ v: 0.55, n: 'ปกติ' }, { v: 1.3, n: 'สูงมาก' }, { v: 0.15, n: 'เรียบ' }];
const SEG_W = 172, SEG_H = 92, PLANE_W = 8.6, PLANE_H = PLANE_W * canvas.height / canvas.width;

function computeHeights() {
  const w = SEG_W + 1, h = SEG_H + 1;
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const t = tmp.getContext('2d', { willReadFrequently: true });
  t.drawImage(canvas, 0, 0, w, h);
  const d = t.getImageData(0, 0, w, h).data;
  const pr = parseInt(paperColor.slice(1, 3), 16), pg = parseInt(paperColor.slice(3, 5), 16), pb = parseInt(paperColor.slice(5, 7), 16);
  let arr = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const lum = (0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]) / 255;
    const dist = (Math.abs(d[i*4] - pr) + Math.abs(d[i*4+1] - pg) + Math.abs(d[i*4+2] - pb)) / 765;
    arr[i] = dist < 0.04 ? 0 : 0.5 + 0.5 * (1 - lum); // มีสี = นูน, ยิ่งเข้มยิ่งสูง
  }
  for (let pass = 0; pass < 2; pass++) { // เบลอเบาๆ ให้ขอบนุ่ม
    const out = new Float32Array(arr.length);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) { s += arr[yy * w + xx]; n++; }
      }
      out[y * w + x] = s / n;
    }
    arr = out;
  }
  return arr;
}

function applyDepth() {
  const pos = mesh.geometry.attributes.position, k = DEPTHS[depthIdx].v;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, heights[i] * k);
  pos.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

function open3D() {
  if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
    statusText.style.color = '#e63946';
    statusText.textContent = 'โหลดระบบ 3 มิติไม่สำเร็จ ลองเช็กอินเทอร์เน็ตแล้วรีเฟรชนะครับ';
    return;
  }
  modal.style.display = 'flex';
  const W = container.clientWidth, H = container.clientHeight;

  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.set(0, -3.2, 7.5);
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(3, -4, 8);
    scene.add(dir);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2.5;
    controls.maxDistance = 16;
    controls.minDistance = 3;
  }
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.map.dispose(); mesh.material.dispose(); }
  const snap = document.createElement('canvas'); // ภาพนิ่งของรูปตอนกดปุ่ม
  snap.width = canvas.width; snap.height = canvas.height;
  snap.getContext('2d').drawImage(canvas, 0, 0);
  const tex = new THREE.CanvasTexture(snap);
  tex.anisotropy = 4;
  mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(PLANE_W, PLANE_H, SEG_W, SEG_H),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.05, side: THREE.DoubleSide })
  );
  scene.add(mesh);
  heights = computeHeights();
  applyDepth();

  controls.reset && controls.reset();
  camera.position.set(0, -3.2, 7.5);
  controls.autoRotate = true;
  autoRotateBtn.textContent = '🔄 หมุนอัตโนมัติ: เปิด';
  if (!rafId) animate();
}

function animate() {
  rafId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function close3D() {
  modal.style.display = 'none';
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

$('open3dBtn').onclick = () => { playPop(800); open3D(); };
$('close3dBtn').onclick = () => { playPop(400); close3D(); };
$('backToDrawBtn').onclick = () => { playPop(400); close3D(); };
autoRotateBtn.onclick = () => {
  playPop(520);
  controls.autoRotate = !controls.autoRotate;
  autoRotateBtn.textContent = '🔄 หมุนอัตโนมัติ: ' + (controls.autoRotate ? 'เปิด' : 'ปิด');
};
toggleDepthBtn.onclick = () => {
  playPop(620);
  depthIdx = (depthIdx + 1) % DEPTHS.length;
  toggleDepthBtn.textContent = '🏔️ ความนูน: ' + DEPTHS[depthIdx].n;
  if (mesh) applyDepth();
};
window.addEventListener('resize', () => {
  if (!renderer || modal.style.display !== 'flex') return;
  const W = container.clientWidth, H = container.clientHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
